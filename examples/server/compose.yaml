# CMS + Postgres + MinIO on one machine: docker compose up
# Then open http://localhost:3000/admin and use the setup code from `docker compose logs cms`.
services:
  cms:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://cms:cms@db:5432/cms
      CMS_PREVIEW_SECRET: ${CMS_PREVIEW_SECRET:?set CMS_PREVIEW_SECRET (openssl rand -base64 32)}
      CMS_SECRETS_KEY: ${CMS_SECRETS_KEY:?set CMS_SECRETS_KEY (openssl rand -base64 32)}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cms
      S3_KEY: minio
      S3_SECRET: minio-secret
      S3_PUBLIC_URL: http://localhost:9000/cms
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: cms, POSTGRES_PASSWORD: cms, POSTGRES_DB: cms }
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cms"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [files:/data]
  # Makes the bucket once.
  minio-setup:
    image: minio/mc
    depends_on: [minio]
    entrypoint: ["sh", "-c", "sleep 3; mc alias set m http://minio:9000 minio minio-secret && mc mb -p m/cms && mc anonymous set download m/cms"]
volumes:
  db: {}
  files: {}
