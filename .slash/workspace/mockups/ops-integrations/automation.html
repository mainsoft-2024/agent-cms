<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동화</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="../publish-flow/x.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav"><span data-icon="settings"></span><span>사이트 설정</span></div>
    <div class="nav-gap"></div>
    <div class="nav"><span data-icon="image"></span><span>미디어</span></div>
    <div class="nav"><span data-icon="hard-drive"></span><span>파일</span></div>
    <div class="nav"><span data-icon="clipboard-list"></span><span>폼</span></div>
    <div class="nav"><span data-icon="package"></span><span>릴리스</span></div>
    <div class="nav"><span data-icon="trash-2"></span><span>휴지통</span></div>
    <h2>운영</h2>
    <div class="nav"><span data-icon="key-round"></span><span>API 키</span></div>
    <div class="nav"><span data-icon="scroll-text"></span><span>감사 로그</span></div>
    <div class="nav"><span data-icon="webhook"></span><span>웹훅</span></div>
    <div class="nav on"><span data-icon="workflow"></span><span>자동화</span></div>
    <div class="nav"><span data-icon="shield"></span><span>역할</span></div>
    <div class="nav"><span data-icon="corner-down-right"></span><span>리다이렉트</span></div>
    <div class="nav"><span data-icon="replace"></span><span>동의어</span></div>
    <div class="nav"><span data-icon="arrow-left-right"></span><span>가져오기와 내보내기</span></div>
  </aside>

  <main class="main">
    <header class="phd">
      <span class="crumbs">자동화 <span>/</span></span>
      <h1>게시되면 번역 초안 만들기</h1>
      <span class="sw on" data-label="켜기 스위치"></span>
      <span class="grow"></span>
      <div class="acts">
        <span class="b out" data-label="시험 실행 버튼"><span data-icon="play"></span>시험 실행</span>
        <span class="b">저장</span>
      </div>
    </header>
    <div class="content">
      <div class="pad" style="gap:0" data-label="단계 목록">
        <div class="step" data-label="언제 단계"><span class="k">언제</span><span data-icon="zap"></span><span class="grow">문서가 게시되면</span><span class="chip">Blog</span><span data-icon="chevron-down" class="i14 muted"></span></div>
        <div class="wire"></div>
        <div class="step" data-label="조건 단계"><span class="k">조건</span><span data-icon="filter"></span><span class="grow">분류가 News</span><span data-icon="x" class="i14 muted"></span></div>
        <div class="wire"></div>
        <div class="step" data-label="동작 단계"><span class="k">동작</span><span data-icon="languages"></span><span class="grow">번역 초안 만들기</span><span class="chip">en</span><span data-icon="x" class="i14 muted"></span></div>
        <div class="wire"></div>
        <div class="step"><span class="k">동작</span><span data-icon="webhook"></span><span class="grow">웹훅 보내기</span><span class="chip">Slack 알림</span><span data-icon="x" class="i14 muted"></span></div>
        <div class="wire"></div>
        <div class="row" style="padding-left:2px"><span class="b out sm" data-label="단계 추가 버튼"><span data-icon="plus" class="i14"></span>단계 추가</span></div>
      </div>
      <aside class="side-form" data-label="실행 기록 패널">
        <span class="lbl">실행 기록</span>
        <div class="rows">
          <div><span class="badge"><i class="dot"></i>성공</span><span class="grow trunc">Hello, world</span><span class="xs muted num">오후 9:41</span></div>
          <div><span class="badge"><i class="dot draft"></i>건너뜀</span><span class="grow trunc">Draft ideas</span><span class="xs muted num">오후 7:15</span></div>
          <div><span class="badge"><i class="dot bad"></i>실패</span><span class="grow trunc">Year in review</span><span class="xs muted num">어제</span></div>
          <div><span class="badge"><i class="dot"></i>성공</span><span class="grow trunc">0.6 출시 안내</span><span class="xs muted num">10. 30.</span></div>
        </div>
      </aside>
    </div>
  </main>
</div>
</body>
</html>
