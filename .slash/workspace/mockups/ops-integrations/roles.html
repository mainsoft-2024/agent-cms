<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역할</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="../publish-flow/x.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav"><span data-icon="settings"></span><span>사이트 설정</span></div>
    <div class="nav-gap"></div>
    <div class="nav"><span data-icon="image"></span><span>미디어</span></div>
    <div class="nav"><span data-icon="hard-drive"></span><span>파일</span></div>
    <div class="nav"><span data-icon="clipboard-list"></span><span>폼</span></div>
    <div class="nav"><span data-icon="package"></span><span>릴리스</span></div>
    <div class="nav"><span data-icon="trash-2"></span><span>휴지통</span></div>
    <h2>운영</h2>
    <div class="nav"><span data-icon="key-round"></span><span>API 키</span></div>
    <div class="nav"><span data-icon="scroll-text"></span><span>감사 로그</span></div>
    <div class="nav"><span data-icon="webhook"></span><span>웹훅</span></div>
    <div class="nav"><span data-icon="workflow"></span><span>자동화</span></div>
    <div class="nav on"><span data-icon="shield"></span><span>역할</span></div>
    <div class="nav"><span data-icon="corner-down-right"></span><span>리다이렉트</span></div>
    <div class="nav"><span data-icon="replace"></span><span>동의어</span></div>
    <div class="nav"><span data-icon="arrow-left-right"></span><span>가져오기와 내보내기</span></div>
  </aside>

  <main class="main">
    <header class="phd">
      <h1>역할</h1>
      <span class="grow"></span>
      <div class="acts"><span class="b" data-label="새 역할 버튼"><span data-icon="plus"></span>새 역할</span></div>
    </header>
    <div class="content">
      <nav class="folders" data-label="역할 목록">
        <div class="fold"><span data-icon="shield-check"></span><span class="grow">관리자</span><span class="n">2</span></div>
        <div class="fold on"><span data-icon="shield"></span><span class="grow">편집자</span><span class="n">3</span></div>
        <div class="fold"><span data-icon="shield"></span><span class="grow">작성자</span><span class="n">5</span></div>
        <div class="fold"><span data-icon="shield"></span><span class="grow">보기 전용</span><span class="n">1</span></div>
      </nav>
      <div class="pad">
        <div class="row">
          <div class="field" style="width:260px"><label>이름</label><div class="inp">편집자</div></div>
          <span class="grow"></span>
          <span class="b out sm danger-text" style="align-self:flex-end">삭제</span>
          <span class="b sm" style="align-self:flex-end">저장</span>
        </div>
        <table data-label="권한 표">
          <thead><tr><th>대상</th><th style="width:96px">읽기</th><th style="width:96px">쓰기</th><th style="width:96px">게시</th><th style="width:96px">삭제</th></tr></thead>
          <tbody>
            <tr><td style="font-weight:500">Blog</td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check"></span></td></tr>
            <tr><td style="font-weight:500">Guide</td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check"></span></td></tr>
            <tr><td style="font-weight:500">사이트 설정</td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check"></span></td><td><span class="check"></span></td><td><span class="check"></span></td></tr>
            <tr><td style="font-weight:500">미디어</td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td class="muted">없음</td><td><span class="check"></span></td></tr>
            <tr><td style="font-weight:500">폼</td><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td><span class="check"></span></td><td class="muted">없음</td><td><span class="check"></span></td></tr>
          </tbody>
        </table>
        <div class="field" data-label="이 역할의 사람">
          <span class="lbl">사람 3</span>
          <div class="row"><span class="chip">김지수<span data-icon="x" class="i12 muted"></span></span><span class="chip">박민호<span data-icon="x" class="i12 muted"></span></span><span class="chip">이서연<span data-icon="x" class="i12 muted"></span></span><span class="b ghost xsb"><span data-icon="plus" class="i14"></span>추가</span></div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
