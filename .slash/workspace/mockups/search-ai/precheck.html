<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시 전 점검</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="../media-library/editor.css">
<link rel="stylesheet" href="../publish-flow/x.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app" style="position:relative">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav on"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav"><span data-icon="settings"></span><span>사이트 설정</span></div>
    <div class="nav-gap"></div>
    <div class="nav"><span data-icon="image"></span><span>미디어</span></div>
    <div class="nav"><span data-icon="hard-drive"></span><span>파일</span></div>
    <div class="nav"><span data-icon="clipboard-list"></span><span>폼</span></div>
    <div class="nav"><span data-icon="package"></span><span>릴리스</span></div>
    <div class="nav"><span data-icon="trash-2"></span><span>휴지통</span></div>
    <h2>운영</h2>
    <div class="nav"><span data-icon="key-round"></span><span>API 키</span></div>
    <div class="nav"><span data-icon="scroll-text"></span><span>감사 로그</span></div>
    <div class="nav"><span data-icon="webhook"></span><span>웹훅</span></div>
    <div class="nav"><span data-icon="workflow"></span><span>자동화</span></div>
    <div class="nav"><span data-icon="shield"></span><span>역할</span></div>
    <div class="nav"><span data-icon="corner-down-right"></span><span>리다이렉트</span></div>
    <div class="nav"><span data-icon="replace"></span><span>동의어</span></div>
    <div class="nav"><span data-icon="arrow-left-right"></span><span>가져오기와 내보내기</span></div>
  </aside>

  <main class="main">
    <header class="phd">
      <span class="crumbs">Guide <span>/</span></span>
      <h1>미디어 올리는 법</h1>
      <span class="badge"><i class="dot draft"></i>초안</span>
      <span class="grow"></span>
      <div class="acts">
        <span class="b ghost"><span data-icon="history"></span>버전 기록</span>
        <span class="b out">저장</span>
        <span class="b">게시</span>
      </div>
    </header>
    <div class="pad">
      <div class="phl" style="width:34%"></div><div class="phl" style="width:80%"></div><div class="phl" style="width:74%"></div><div class="phl" style="width:52%"></div><div class="phl" style="width:78%"></div><div class="phl" style="width:40%"></div>
    </div>
  </main>

  <div class="veil">
    <div class="dlg" style="width:520px" data-label="게시 전 점검 창">
      <div>
        <h2>게시 전 점검</h2>
        <p>문제 1개, 경고 2개</p>
      </div>
      <div class="rows" data-label="점검 목록">
        <div data-label="문제 항목"><span data-icon="circle-x" style="color:var(--destructive)"></span><span class="grow trunc">깨진 링크 1개</span><span class="mono muted xs">/guide/slack</span></div>
        <div data-label="경고 항목"><span data-icon="triangle-alert" class="warn"></span><span class="grow trunc">대체 텍스트가 없는 이미지 1개</span><span class="muted xs num">11번째 줄</span></div>
        <div><span data-icon="triangle-alert" class="warn"></span><span class="grow trunc">긴 섹션 1개</span><span class="muted xs num">Steps, 2,140자</span></div>
        <div><span data-icon="circle-check" style="color:#16a34a"></span><span class="grow trunc">필수 섹션</span></div>
        <div><span data-icon="circle-check" style="color:#16a34a"></span><span class="grow trunc">요약</span></div>
        <div><span data-icon="circle-check" style="color:#16a34a"></span><span class="grow trunc">다른 문서로 가는 링크</span></div>
      </div>
      <div class="btns"><span class="b out">취소</span><span class="b" style="opacity:.5" data-label="게시 버튼 (문제가 있어 꺼짐)">게시</span></div>
    </div>
  </div>
</div>
</body>
</html>
