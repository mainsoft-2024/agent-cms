<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휴지통</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="x.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav"><span data-icon="settings"></span><span>사이트 설정</span></div>
    <div class="nav-gap"></div>
    <div class="nav"><span data-icon="image"></span><span>미디어</span></div>
    <div class="nav"><span data-icon="hard-drive"></span><span>파일</span></div>
    <div class="nav"><span data-icon="clipboard-list"></span><span>폼</span></div>
    <div class="nav"><span data-icon="package"></span><span>릴리스</span></div>
    <div class="nav on"><span data-icon="trash-2"></span><span>휴지통</span><span class="n">3</span></div>
    <h2>운영</h2>
    <div class="nav"><span data-icon="key-round"></span><span>API 키</span></div>
    <div class="nav"><span data-icon="scroll-text"></span><span>감사 로그</span></div>
    <div class="nav"><span data-icon="webhook"></span><span>웹훅</span></div>
    <div class="nav"><span data-icon="workflow"></span><span>자동화</span></div>
    <div class="nav"><span data-icon="shield"></span><span>역할</span></div>
    <div class="nav"><span data-icon="corner-down-right"></span><span>리다이렉트</span></div>
    <div class="nav"><span data-icon="replace"></span><span>동의어</span></div>
    <div class="nav"><span data-icon="arrow-left-right"></span><span>가져오기와 내보내기</span></div>
  </aside>

  <main class="main">
    <header class="phd">
      <h1>휴지통</h1>
      <span class="grow"></span>
      <div class="acts"><span class="b out danger-text" data-label="휴지통 비우기 버튼"><span data-icon="trash-2"></span>휴지통 비우기</span></div>
    </header>
    <div class="pad">
      <div class="row">
        <div class="seg" data-label="종류 탭"><span class="on">문서 2</span><span>파일 1</span></div>
      </div>
      <div class="row" style="height:42px;padding:0 12px;border:1px solid var(--border-c);border-radius:var(--radius-lg);background:hsl(0 0% 96.1% / .5)" data-label="일괄 작업">
        <span style="font-size:13px;font-weight:500">1개 선택됨</span>
        <span class="b out xsb" data-label="복구 버튼"><span data-icon="undo-2" class="i14"></span>복구</span>
        <span class="b out xsb danger-text" data-label="영구 삭제 버튼"><span data-icon="trash-2" class="i14"></span>영구 삭제</span>
        <span class="grow"></span>
        <span class="b ghost xsb">선택 해제</span>
      </div>
      <table data-label="휴지통 표">
        <thead><tr><th style="width:36px"><span class="check"></span></th><th>이름</th><th style="width:120px">위치</th><th style="width:150px">삭제한 사람</th><th style="width:140px">삭제한 날</th><th class="r" style="width:130px">영구 삭제까지</th><th style="width:40px"></th></tr></thead>
        <tbody>
          <tr class="picked"><td><span class="check on"><span data-icon="check" class="i12"></span></span></td><td style="font-weight:500">Old pricing</td><td>Blog</td><td>김지수</td><td class="num">2026. 11. 16.</td><td class="r num">27일</td><td><span data-icon="more-horizontal" class="muted"></span></td></tr>
          <tr><td><span class="check"></span></td><td style="font-weight:500">Beta notes</td><td>Guide</td><td><span class="row"><span data-icon="bot" class="i14 muted"></span>docs-bot</span></td><td class="num">2026. 11. 02.</td><td class="r num">13일</td><td><span data-icon="more-horizontal" class="muted"></span></td></tr>
        </tbody>
      </table>
      <div class="foot"><span class="num">2개 중 2개</span></div>
    </div>
  </main>
</div>
</body>
</html>
