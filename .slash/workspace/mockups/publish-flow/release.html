<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴리스 하나</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="x.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav"><span data-icon="settings"></span><span>사이트 설정</span></div>
    <div class="nav-gap"></div>
    <div class="nav"><span data-icon="image"></span><span>미디어</span></div>
    <div class="nav"><span data-icon="hard-drive"></span><span>파일</span></div>
    <div class="nav"><span data-icon="clipboard-list"></span><span>폼</span></div>
    <div class="nav on"><span data-icon="package"></span><span>릴리스</span></div>
    <div class="nav"><span data-icon="trash-2"></span><span>휴지통</span></div>
    <h2>운영</h2>
    <div class="nav"><span data-icon="key-round"></span><span>API 키</span></div>
    <div class="nav"><span data-icon="scroll-text"></span><span>감사 로그</span></div>
    <div class="nav"><span data-icon="webhook"></span><span>웹훅</span></div>
    <div class="nav"><span data-icon="workflow"></span><span>자동화</span></div>
    <div class="nav"><span data-icon="shield"></span><span>역할</span></div>
    <div class="nav"><span data-icon="corner-down-right"></span><span>리다이렉트</span></div>
    <div class="nav"><span data-icon="replace"></span><span>동의어</span></div>
    <div class="nav"><span data-icon="arrow-left-right"></span><span>가져오기와 내보내기</span></div>
  </aside>

  <main class="main">
    <header class="phd">
      <span class="crumbs">릴리스 <span>/</span></span>
      <h1>0.7 출시</h1>
      <span class="badge"><i class="dot sched"></i>예약됨</span>
      <span class="muted xs num">2026. 11. 24. 오전 9:00</span>
      <span class="grow"></span>
      <div class="acts">
        <span class="b out" data-label="문서 추가 버튼"><span data-icon="plus"></span>문서 추가</span>
        <span class="b out" data-label="예약 버튼"><span data-icon="calendar-clock"></span>예약</span>
        <span class="b" data-label="게시 버튼">게시</span>
      </div>
    </header>
    <div class="pad">
      <table data-label="릴리스의 문서 표">
        <thead><tr><th>제목</th><th style="width:120px">컬렉션</th><th style="width:220px">바뀌는 것</th><th style="width:140px">문제</th><th style="width:40px"></th></tr></thead>
        <tbody>
          <tr><td style="font-weight:500">0.7 출시 안내</td><td>Blog</td><td>새로 게시 <span class="muted num">v3</span></td><td class="muted">문제 없음</td><td><span data-icon="x" class="muted"></span></td></tr>
          <tr data-label="문제가 있는 문서"><td style="font-weight:500">미디어 올리는 법</td><td>Guide</td><td>새로 게시 <span class="muted num">v2</span></td><td style="color:#b45309"><span class="row"><span data-icon="circle-alert" class="i14"></span>문제 1개</span></td><td><span data-icon="x" class="muted"></span></td></tr>
          <tr><td style="font-weight:500">Getting started</td><td>Guide</td><td class="num">v5 → v7</td><td class="muted">문제 없음</td><td><span data-icon="x" class="muted"></span></td></tr>
          <tr><td style="font-weight:500">Old pricing</td><td>Blog</td><td>게시 취소</td><td class="muted">문제 없음</td><td><span data-icon="x" class="muted"></span></td></tr>
        </tbody>
      </table>
      <div class="foot"><span class="num">문서 4개</span></div>
    </div>
  </main>
</div>
</body>
</html>
