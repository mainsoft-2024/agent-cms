<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단일 문서</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="../media-library/editor.css">
<link rel="stylesheet" href="../publish-flow/x.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav on" data-label="단일 문서 메뉴"><span data-icon="settings"></span><span>사이트 설정</span></div>
    <div class="nav-gap"></div>
    <div class="nav"><span data-icon="image"></span><span>미디어</span></div>
    <div class="nav"><span data-icon="hard-drive"></span><span>파일</span></div>
    <div class="nav"><span data-icon="clipboard-list"></span><span>폼</span></div>
    <div class="nav"><span data-icon="package"></span><span>릴리스</span></div>
    <div class="nav"><span data-icon="trash-2"></span><span>휴지통</span></div>
    <h2>운영</h2>
    <div class="nav"><span data-icon="key-round"></span><span>API 키</span></div>
    <div class="nav"><span data-icon="scroll-text"></span><span>감사 로그</span></div>
    <div class="nav"><span data-icon="webhook"></span><span>웹훅</span></div>
    <div class="nav"><span data-icon="workflow"></span><span>자동화</span></div>
    <div class="nav"><span data-icon="shield"></span><span>역할</span></div>
    <div class="nav"><span data-icon="corner-down-right"></span><span>리다이렉트</span></div>
    <div class="nav"><span data-icon="replace"></span><span>동의어</span></div>
    <div class="nav"><span data-icon="arrow-left-right"></span><span>가져오기와 내보내기</span></div>
  </aside>

  <main class="main">
    <header class="phd">
      <h1>사이트 설정</h1>
      <span class="badge"><i class="dot"></i>게시됨</span>
      <span class="grow"></span>
      <div class="acts">
        <span class="b ghost"><span data-icon="history"></span>버전 기록</span>
        <span class="b out">저장</span>
        <span class="b">게시</span>
      </div>
    </header>
    <div class="pad" style="max-width:760px">
      <div class="cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <div class="field"><label>Site name</label><div class="inp">Example</div></div>
        <div class="field"><label>Logo</label>
          <div class="cover" style="height:36px"><div class="mini p5"></div><span class="grow trunc" style="font-size:13.5px">logo.svg</span><span class="b out xsb">바꾸기</span><span class="b ghost xsb">제거</span></div>
        </div>
      </div>
      <div class="field"><label>Description</label><div class="inp">People and agents write the same documents.</div></div>
      <div class="field" data-label="목록 필드">
        <label>Menu</label>
        <div class="rows">
          <div><span data-icon="grip-vertical" class="i14 muted"></span><span style="width:160px">Blog</span><span class="grow mono muted" style="font-size:12.5px">/blog</span><span data-icon="x" class="i14 muted"></span></div>
          <div><span data-icon="grip-vertical" class="i14 muted"></span><span style="width:160px">Guide</span><span class="grow mono muted" style="font-size:12.5px">/guide</span><span data-icon="x" class="i14 muted"></span></div>
          <div><span data-icon="grip-vertical" class="i14 muted"></span><span style="width:160px">Pricing</span><span class="grow mono muted" style="font-size:12.5px">/pricing</span><span data-icon="x" class="i14 muted"></span></div>
        </div>
        <div class="row"><span class="b out xsb"><span data-icon="plus" class="i14"></span>항목 추가</span></div>
      </div>
      <div class="field"><label>Footer</label><div class="area">© 2026 Example</div></div>
    </div>
    <div class="footb"><span>문제 없음</span><span class="grow"></span><span>자동 저장됨 오후 9:42</span></div>
  </main>
</div>
</body>
</html>
