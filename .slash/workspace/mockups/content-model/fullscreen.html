<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체화면</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="../publish-flow/x.css">
<link rel="stylesheet" href="v2.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="main" style="height:100%">
  <div class="tb" role="toolbar" data-label="전체화면 도구 줄" style="height:48px">
    <span class="tbtn" data-icon="minimize-2"></span>
    <span style="font-size:14px;font-weight:500;margin:0 8px">Connect Slack</span>
    <span class="xs muted">자동 저장됨</span>
    <span class="grow"></span>
    <div class="grp"><span class="tbtn" data-icon="undo-2"></span><span class="tbtn" data-icon="redo-2"></span></div>
    <span class="tsep"></span>
    <span class="tbtn wide">본문<span data-icon="chevron-down" class="car"></span></span>
    <span class="tsep"></span>
    <div class="grp"><span class="tbtn" data-icon="bold"></span><span class="tbtn" data-icon="italic"></span><span class="tbtn" data-icon="code"></span><span class="tbtn" data-icon="link"></span></div>
    <span class="tsep"></span>
    <span class="tbtn wide"><span data-icon="image-plus" class="i14"></span><span data-icon="chevron-down" class="car"></span></span>
    <span class="tbtn wide"><span data-icon="plus" class="i14"></span>넣기<span data-icon="chevron-down" class="car"></span></span>
    <span class="grow"></span>
    <span class="tbtn" data-icon="sliders-horizontal"></span>
    <span class="tbtn" data-icon="panel-right"></span>
    <span class="tsep"></span>
    <span class="b out sm">저장</span>
    <span class="b sm" style="margin-left:6px">게시<span data-icon="chevron-down" class="i14"></span></span>
  </div>
  <div class="paper">
    <div class="colw">
      <div class="blk"><h2 style="margin-top:8px">Connect<span class="anchor">#connect</span></h2></div>
      <div class="blk"><p>Link your Slack workspace in two steps. Messages from agent-cms arrive in the channel you pick.</p></div>
      <div class="blk callout"><span data-icon="info" class="i20" style="color:#2563eb"></span><span>You need admin rights in Slack.</span></div>
      <div class="blk"><div class="steps">
        <div class="s" data-n="1"><b>Open settings</b><span>Go to Settings → Integrations.</span></div>
        <div class="s" data-n="2"><b>Choose Slack</b><span>Pick the workspace and the channel.</span></div>
      </div></div>
    </div>
  </div>
  <div class="estat"><span>문제 없음</span><span class="grow"></span><span>312단어 · 2분</span></div>
</div>
</body>
</html>
