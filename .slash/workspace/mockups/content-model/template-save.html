<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이 문서를 템플릿으로 저장</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="../publish-flow/x.css">
<link rel="stylesheet" href="v2.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app" style="position:relative">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav on"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav"><span data-icon="puzzle"></span><span>Snippets</span><span class="n">3</span></div>
    <div class="nav"><span data-icon="settings"></span><span>사이트 설정</span></div>
  </aside>
  <main class="main">
    <header class="ed-top">
      <span class="crumbs">Guide <span>/</span></span>
      <h1>Connect Slack</h1>
      <span class="grow"></span>
      <span class="b ghost sm"><span data-icon="history" class="i14"></span>버전 기록</span>
      <span class="b out sm">저장</span>
      <span class="b sm">게시<span data-icon="chevron-down" class="i14"></span></span>
      <span class="b ghost ico on" style="background:var(--accent-bg)"><span data-icon="ellipsis"></span></span>
    </header>
    <div class="pad"><div class="phl" style="width:40%"></div><div class="phl" style="width:85%"></div><div class="phl" style="width:85%"></div><div class="phl" style="width:60%"></div></div>
  </main>

  <div class="veil">
    <div class="dlg" style="width:520px" data-label="템플릿으로 저장 창">
      <div><h2>템플릿으로 저장</h2><p>Guide의 새 문서를 만들 때 고를 수 있음. 사람과 에이전트가 같이 씀.</p></div>
      <div class="field"><label>이름</label><div class="inp">연동 안내</div></div>
      <div class="field"><label>설명</label><div class="inp">Connect, Steps, Troubleshooting</div></div>
      <div class="field"><label>담을 것</label>
        <div class="col" style="gap:8px;font-size:14px">
          <div class="row"><span class="radio"></span>본문은 제목만 남기고 비움</div>
          <div class="row"><span class="radio on"></span>본문 그대로</div>
          <div class="row"><span class="check on"><span data-icon="check" class="i12"></span></span>필드 값 (분류, Tags)</div>
          <div class="row"><span class="check"></span>요약</div>
        </div>
      </div>
      <div class="btns"><span class="b out">취소</span><span class="b">저장</span></div>
    </div>
  </div>
</div>
</body>
</html>
