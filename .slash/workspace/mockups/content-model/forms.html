<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폼</title>
<link rel="stylesheet" href="https://slash.ai.kr/mockup-kit/v1/kit.css">
<link rel="stylesheet" href="../media-library/app.css">
<link rel="stylesheet" href="../publish-flow/x.css">
<script src="https://slash.ai.kr/mockup-kit/v1/kit.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Example</div>
    <div class="sbtn"><span data-icon="search"></span><span class="grow">검색</span><kbd>⌘K</kbd></div>
    <div class="nav"><span data-icon="layout-dashboard"></span><span>대시보드</span></div>
    <h2>컬렉션</h2>
    <div class="nav"><span data-icon="book-open"></span><span>Blog</span><span class="n">5</span></div>
    <div class="nav"><span data-icon="book-open"></span><span>Guide</span><span class="n">6</span></div>
    <div class="nav"><span data-icon="settings"></span><span>사이트 설정</span></div>
    <div class="nav-gap"></div>
    <div class="nav"><span data-icon="image"></span><span>미디어</span></div>
    <div class="nav"><span data-icon="hard-drive"></span><span>파일</span></div>
    <div class="nav on"><span data-icon="clipboard-list"></span><span>폼</span></div>
    <div class="nav"><span data-icon="package"></span><span>릴리스</span></div>
    <div class="nav"><span data-icon="trash-2"></span><span>휴지통</span></div>
    <h2>운영</h2>
    <div class="nav"><span data-icon="key-round"></span><span>API 키</span></div>
    <div class="nav"><span data-icon="scroll-text"></span><span>감사 로그</span></div>
    <div class="nav"><span data-icon="webhook"></span><span>웹훅</span></div>
    <div class="nav"><span data-icon="workflow"></span><span>자동화</span></div>
    <div class="nav"><span data-icon="shield"></span><span>역할</span></div>
    <div class="nav"><span data-icon="corner-down-right"></span><span>리다이렉트</span></div>
    <div class="nav"><span data-icon="replace"></span><span>동의어</span></div>
    <div class="nav"><span data-icon="arrow-left-right"></span><span>가져오기와 내보내기</span></div>
  </aside>

  <main class="main">
    <header class="phd">
      <span class="crumbs">폼 <span>/</span></span>
      <h1>문의하기</h1>
      <span class="sw on" data-label="받기 스위치"></span>
      <span class="grow"></span>
      <div class="acts">
        <span class="b ghost"><span data-icon="code"></span>넣는 코드</span>
        <span class="b">저장</span>
      </div>
    </header>
    <div class="tabs2" data-label="탭"><span class="on">필드</span><span>제출 12</span><span>설정</span></div>
    <div class="content">
      <div class="pad" style="gap:8px" data-label="필드 목록">
        <div class="step"><span data-icon="grip-vertical" class="i14 muted"></span><span data-icon="type" class="muted"></span><span class="grow">이름</span><span class="chip">한 줄 글</span><span class="badge">필수</span></div>
        <div class="step" style="outline:2px solid var(--ring);outline-offset:2px" data-label="고른 필드"><span data-icon="grip-vertical" class="i14 muted"></span><span data-icon="mail" class="muted"></span><span class="grow">이메일</span><span class="chip">이메일</span><span class="badge">필수</span></div>
        <div class="step"><span data-icon="grip-vertical" class="i14 muted"></span><span data-icon="chevron-down" class="muted"></span><span class="grow">문의 종류</span><span class="chip">선택</span></div>
        <div class="step"><span data-icon="grip-vertical" class="i14 muted"></span><span data-icon="align-left" class="muted"></span><span class="grow">내용</span><span class="chip">여러 줄 글</span><span class="badge">필수</span></div>
        <div class="step"><span data-icon="grip-vertical" class="i14 muted"></span><span data-icon="paperclip" class="muted"></span><span class="grow">첨부</span><span class="chip">파일</span></div>
        <div class="row" style="margin-top:6px"><span class="b out sm" data-label="필드 추가 버튼"><span data-icon="plus" class="i14"></span>필드 추가</span></div>
      </div>
      <aside class="side-form" data-label="필드 설정">
        <div class="field"><label>이름</label><div class="inp">이메일</div></div>
        <div class="field"><label>종류</label><div class="inp"><span class="grow">이메일</span><span data-icon="chevron-down" class="i14 muted"></span></div></div>
        <div class="field"><label>도움말</label><div class="inp ph-text">없음</div></div>
        <div class="row"><span class="grow" style="font-size:14px;font-weight:500">필수</span><span class="sw on"></span></div>
        <span class="grow"></span>
        <div class="row"><span class="b out sm danger-text">삭제</span></div>
      </aside>
    </div>
  </main>
</div>
</body>
</html>
