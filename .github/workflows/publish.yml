name: Publish
# Push a tag `v<version>` (matching package.json) to publish to npmjs.com.
#
# Auth: npm trusted publishing (OIDC, no stored token) once the package has
# a Trusted Publisher for this repository and workflow. Before that (first
# release), put an npm automation token in the `NPM_TOKEN` secret; remove it
# after switching to trusted publishing.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
