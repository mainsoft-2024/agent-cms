name: Publish
# Releases: push a tag `v<version>` (matching package.json) to publish to npmjs.com as `latest`.
#
# Previews: every push to main that touches the package publishes
# `<next patch>-next.<date>.<sha>` under the `next` tag, so apps built on this
# package can try a change before it is released:
#   npm i @mainsoft/agent-cms@next
# Run the workflow by hand (Actions → Publish → Run workflow) to publish a
# preview of another branch.
#
# Auth: npm trusted publishing (OIDC). The package's Trusted Publisher on
# npmjs.com is this repository and this workflow file, so no token is stored.
# setup-node writes an .npmrc that reads NODE_AUTH_TOKEN; it is left unset on
# purpose so npm takes the OIDC path.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "src/**"
      - "registry/**"
      - "admin/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsup.config.ts"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mainsoft-2024/agent-cms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Preview version
        if: github.ref_type != 'tag'
        run: |
          base=$(node -p "const [a,b,c]=require('./package.json').version.split('-')[0].split('.').map(Number); [a,b,c+1].join('.')")
          v="${base}-next.$(date -u +%Y%m%d%H%M).${GITHUB_SHA::7}"
          npm version "$v" --no-git-tag-version
          sed -i "s/VERSION = \".*\"/VERSION = \"$v\"/" src/version.ts
          echo "Preview $v"
      - run: npm ci
      - name: Publish release
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public
      - name: Publish preview
        if: github.ref_type != 'tag'
        run: npm publish --provenance --access public --tag next
