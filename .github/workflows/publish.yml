name: Publish
# Push a tag `v<version>` (matching package.json) to publish to npmjs.com.
#
# Auth: npm trusted publishing (OIDC). The package's Trusted Publisher on
# npmjs.com is this repository and this workflow file, so no token is stored.
# setup-node writes an .npmrc that reads NODE_AUTH_TOKEN; it is left unset on
# purpose so npm takes the OIDC path.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm publish --provenance --access public
