name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pack

  db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pglite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: test:db (${{ matrix.target }})
        run: npm run test:db
        env:
          DATABASE_URL: ${{ matrix.target == 'postgres' && 'postgres://postgres:postgres@localhost:5432/cms' || '' }}

  storage:
    # The S3 adapter against a real S3-compatible server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/s3-dev.sh
      - run: npm run test:s3
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9100
      # The Vercel Blob adapter against real stores. Without the secrets (forks) the real-store tests skip themselves.
      - run: npm run test:blob
        env:
          BLOB_TEST_PRIVATE_TOKEN: ${{ secrets.BLOB_TEST_PRIVATE_TOKEN }}
          BLOB_TEST_PUBLIC_TOKEN: ${{ secrets.BLOB_TEST_PUBLIC_TOKEN }}

  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/pack-smoke.sh

  shadcn-smoke:
    # `npx shadcn add <url>` into a fresh Next.js app, for both shadcn bases.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/shadcn-smoke.sh
        env:
          BASE: ${{ matrix.base }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p registry/tsconfig.json --noEmit
      # A memory cap and a time limit: a runaway test then fails with a readable Node error
      # instead of taking the runner down with it (which leaves no log of what happened).
      - run: npm run test:ui
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=2048

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The media library tests need a storage; without S3_ENDPOINT they are skipped.
      - run: bash scripts/s3-dev.sh
      - run: npm run test:e2e
        env:
          S3_ENDPOINT: http://127.0.0.1:9100
          S3_KEY: test
          S3_SECRET: testsecret1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix apps/docs run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix apps/docs run test:e2e
